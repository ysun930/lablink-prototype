<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Dashboard - LabLink</title>
<link rel="stylesheet" href="style.css">
<style>
  .dash-header { background:#E4F7F6; padding:50px 24px; text-align:center; font-family:Arial, Helvetica, sans-serif; }
  .dash-header h1 { font-size:30px; margin:0 0 8px; }
  .dash-header p { color:#5B6B72; margin:0; }
  .dash-main { max-width:900px; margin:0 auto; padding:50px 24px; font-family:Arial, Helvetica, sans-serif; }
  .dash-main h2 { font-size:22px; margin:0 0 20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:14px 16px; font-size:14px; }
  th { color:#5B6B72; font-size:12px; text-transform:uppercase; border-bottom:2px solid #C9EEEC; }
  tr:not(:last-child) td { border-bottom:1px solid #C9EEEC; }
  .score-pill { display:inline-block; background:#E4F7F6; color:#1C9099; font-weight:700; padding:4px 10px; border-radius:20px; font-size:13px; }
  .empty-state { color:#5B6B72; font-size:14.5px; }
</style>
</head>
<body>

<div class="dash-header">
  <h1 id="lab-title">Lab Dashboard</h1>
  <a href="logout.html">Sign Out</a>
  <p>Candidates matched to your lab, ranked by combined score.</p>
</div>

<div class="dash-main">
  <h2>Matched candidates</h2>
  <div id="results-container"><p class="empty-state">Loading matches...</p></div>
</div>

<script type="module">
import { supabase } from './supabase.js';

const { data: { session } } = await supabase.auth.getSession();
if (!session) window.location.href = 'login.html';
const currentUser = session.user;

const container = document.getElementById('results-container');

const { data: lab } = await supabase
  .from('labs').select('*').eq('user_id', currentUser.id).single();

if (lab) document.getElementById('lab-title').textContent = lab.lab_name;

if (!lab) {
  container.innerHTML = '<p class="empty-state">No lab found for this account. <a href="labform.html">Register your lab</a>.</p>';
} else {
  const { data: matches, error } = await supabase
    .from('matches')
    .select('*, candidates(candidate_name, education_level, confirmed_skills)')
    .eq('lab_id', lab.id)
    .order('combined_percent', { ascending: false });

  if (error) {
    container.innerHTML = '<p class="empty-state">Could not load matches: ' + error.message + '</p>';
  } else if (!matches || matches.length === 0) {
    container.innerHTML = '<p class="empty-state">No candidates have been matched to your lab yet.</p>';
  } else {
    const rows = matches.map(m => {
      const c = m.candidates || {};
      const skills = c.confirmed_skills ? Object.keys(c.confirmed_skills).slice(0, 3).join(', ') : '-';
      return `
        <tr>
          <td>${c.candidate_name || 'Candidate'}</td>
          <td>${c.education_level || '-'}</td>
          <td>${skills}</td>
          <td><span class="score-pill">${Math.round((m.combined_percent || 0) * 100)}%</span></td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <table>
        <thead><tr><th>Candidate</th><th>Education</th><th>Top Skills</th><th>Combined Score</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
}
</script>

</body>
</html>
