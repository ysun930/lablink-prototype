<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard - LabLink</title>
<link rel="stylesheet" href="style.css">
<style>
  .dash-header { background:#E4F7F6; padding:50px 24px; font-family:Arial, Helvetica, sans-serif; }
  .dash-header .inner { max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; }
  .dash-header h1 { font-size:30px; margin:0 0 8px; }
  .dash-header p { color:#5B6B72; margin:0; }
  .dash-actions { display:flex; gap:10px; }
  .dash-btn { background:#1C9099; color:#fff; border:none; padding:11px 20px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  .dash-btn.secondary { background:#fff; color:#1C9099; border:1px solid #1C9099; }
  .dash-main { max-width:900px; margin:0 auto; padding:50px 24px; font-family:Arial, Helvetica, sans-serif; }
  .dash-main h2 { font-size:22px; margin:0 0 20px; }
  .match-card { background:#E4F7F6; border-radius:12px; padding:22px 26px; margin-bottom:16px; }
  .match-card .lab-name { font-size:17px; font-weight:700; margin:0 0 4px; }
  .match-card .institution { font-size:13.5px; color:#5B6B72; margin:0 0 16px; }
  .scores { display:flex; gap:24px; flex-wrap:wrap; }
  .score { text-align:center; }
  .score .n { font-size:22px; font-weight:700; color:#1C9099; }
  .score .l { font-size:11.5px; color:#5B6B72; text-transform:uppercase; }
  .empty-state { color:#5B6B72; font-size:14.5px; }
</style>
</head>
<body>

<div class="dash-header">
  <div class="inner">
    <div>
      <h1 id="greeting">My Dashboard</h1>
      <p>Your profile and saved match results.</p>
    </div>
    <div class="dash-actions">
      <a class="dash-btn secondary" href="candidate_form.html">Edit Profile</a>
      <a class="dash-btn" href="candidate_form.html">Run Match Again</a>
      <a href="logout.html">Sign Out</a>
    </div>
  </div>
</div>

<div class="dash-main">
  <h2>Your matches</h2>
  <div id="matches-container"><p class="empty-state">Loading your results...</p></div>
</div>

<script type="module">
import { supabase } from './supabase.js';

const { data: { session } } = await supabase.auth.getSession();
if (!session) window.location.href = 'login.html';
const currentUser = session.user;

const container = document.getElementById('matches-container');

const { data: profile } = await supabase
  .from('candidates').select('*').eq('user_id', currentUser.id).single();

if (profile) {
  document.getElementById('greeting').textContent =
    'Welcome back, ' + (profile.candidate_name || currentUser.email);
}

if (!profile) {
  container.innerHTML = '<p class="empty-state">No profile yet. Fill out the candidate form to get your first matches.</p>';
} else {
  const { data: matches, error } = await supabase
    .from('matches')
    .select('*, labs(lab_name, institution)')
    .eq('candidate_id', profile.id)
    .order('combined_percent', { ascending: false });

  if (error) {
    container.innerHTML = '<p class="empty-state">Could not load matches: ' + error.message + '</p>';
  } else if (!matches || matches.length === 0) {
    container.innerHTML = '<p class="empty-state">No saved matches yet. Run a match to see your results here.</p>';
  } else {
    container.innerHTML = matches.map(m => `
      <div class="match-card">
        <div class="lab-name">${m.labs ? m.labs.lab_name : 'Lab'}</div>
        <div class="institution">${m.labs ? m.labs.institution : ''}</div>
        <div class="scores">
          <div class="score"><div class="n">${Math.round((m.rule_percent || 0) * 100)}%</div><div class="l">Rule</div></div>
          <div class="score"><div class="n">${Math.round((m.semantic_percent || 0) * 100)}%</div><div class="l">Semantic</div></div>
          <div class="score"><div class="n">${Math.round((m.combined_percent || 0) * 100)}%</div><div class="l">Combined</div></div>
        </div>
      </div>
    `).join('');
  }
}
</script>

</body>
</html>
